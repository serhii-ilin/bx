# Every push to main that passes the checks is tagged and released:
#   * the next version is the latest vX.Y.Z tag with the patch number bumped,
#     or BX_VERSION from bin/bx when that is higher (edit it for minor/major
#     bumps);
#   * Formula/bx.rb (this repo is also the Homebrew tap) is pointed at the
#     new tag in a follow-up commit on main. Pushes made with GITHUB_TOKEN do
#     not trigger workflows, so that commit is not released again.
name: release

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -s bash bin/bx install.sh uninstall.sh tests/smoke.sh

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./tests/smoke.sh

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick version
        id: version
        run: |
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD is already tagged"; exit 0
          fi
          base=$(sed -n 's/^BX_VERSION="\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' bin/bx)
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            next=$base
          elif [ "$base" != "$latest" ] && [ "$(printf '%s\n%s\n' "$base" "$latest" | sort -V | tail -1)" = "$base" ]; then
            next=$base
          else
            IFS=. read -r major minor patch <<< "$latest"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Releasing v$next"

      - name: Create tag and release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "bx ${TAG#v}" --generate-notes

      - name: Update Homebrew formula
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bx.tar.gz" \
            "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          sha=$(sha256sum "$RUNNER_TEMP/bx.tar.gz" | cut -d' ' -f1)

          git fetch origin main
          git checkout -B main origin/main
          sed -i -E \
            -e "s|^(  url \").*(\")$|\1https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz\2|" \
            -e "s|^(  sha256 \").*(\")$|\1$sha\2|" \
            Formula/bx.rb
          git diff --stat

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bx.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged"
          else
            git commit -m "Formula: bx ${TAG#v} [skip ci]"
            git push origin main
          fi
